name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitlab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is not configured"
            exit 1
          fi

          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/gbroccoli/cookie-consent-modal.git"

      - name: Check whether GitLab main needs sync
        id: sync_check
        run: |
          git fetch gitlab main --tags

          GITHUB_MAIN_SHA="$(git rev-parse origin/main)"
          GITLAB_MAIN_SHA="$(git rev-parse gitlab/main)"

          echo "GitHub main: $GITHUB_MAIN_SHA"
          echo "GitLab main: $GITLAB_MAIN_SHA"

          if [ "$GITHUB_MAIN_SHA" = "$GITLAB_MAIN_SHA" ]; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "GitLab main is already up to date."
            exit 0
          fi

          if git merge-base --is-ancestor "$GITLAB_MAIN_SHA" "$GITHUB_MAIN_SHA"; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "GitLab is behind GitHub. Main sync is required."
            exit 0
          fi

          echo "GitLab main is not an ancestor of GitHub main. Refusing to mirror automatically."
          echo "This usually means GitLab has independent commits or the repositories diverged."
          exit 1

      - name: Push main to GitLab
        if: steps.sync_check.outputs.needs_sync == 'true'
        run: git push gitlab origin/main:main

      - name: Push release tags to GitLab
        run: git push gitlab --tags
