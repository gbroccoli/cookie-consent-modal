name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitlab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is not configured"
            exit 1
          fi

          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/gbroccoli/cookie-consent-modal.git"

      - name: Fetch GitLab state
        id: sync_state
        run: |
          git fetch gitlab main --tags

          GITHUB_MAIN_SHA="$(git rev-parse origin/main)"
          GITLAB_MAIN_SHA="$(git rev-parse gitlab/main)"

          echo "github_main_sha=$GITHUB_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "gitlab_main_sha=$GITLAB_MAIN_SHA" >> "$GITHUB_OUTPUT"

          echo "GitHub main: $GITHUB_MAIN_SHA"
          echo "GitLab main: $GITLAB_MAIN_SHA"

      - name: Sync main to GitLab
        if: steps.sync_state.outputs.github_main_sha != steps.sync_state.outputs.gitlab_main_sha
        run: |
          git push gitlab origin/main:main \
            --force-with-lease=refs/heads/main:${{ steps.sync_state.outputs.gitlab_main_sha }}

      - name: Push release tags to GitLab
        run: git push gitlab --tags
